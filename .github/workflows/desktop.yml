name: Desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run test:app
        if: runner.os != 'Linux'
      - run: xvfb-run --auto-servernum npm run test:app
        if: runner.os == 'Linux'
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Whole-Brain-Simulation-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
